[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ryzen-temp-limit"
version = "0.3.3"
description = "Small Windows GUI to cap AMD Ryzen CPU temperature via PawnIO"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-only" }
authors = [{ name = "socrabs151" }]
keywords = ["amd", "ryzen", "temperature", "throttling", "pawnio", "smu", "laptop"]
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]
dependencies = [
  "zenmaster>=1.2.1,<2.0",
  "certifi>=2024.2.2",
  "pystray>=0.19.5",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.0", "pillow>=10.0"]

[project.scripts]
ryzen-temp-limit = "ryzen_temp_limit.app:main"

[project.gui-scripts]
ryzen-temp-limit-gui = "ryzen_temp_limit.app:main"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["dist", "build", "release"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.setuptools]
packages = ["ryzen_temp_limit"]

[tool.setuptools.package-data]
ryzen_temp_limit = ["assets/*.ico", "assets/*.png"]


