name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow
          python -m pip install -e .

      - name: Verify version matches tag
        shell: pwsh
        run: |
          $version = python -c "import ryzen_temp_limit; print(ryzen_temp_limit.__version__)"
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($version -ne $tag) { throw "version $version does not match tag $tag" }
          Write-Host "version $version matches tag"

      - name: Build onedir
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Package assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item -Recurse dist/RyzenTempLimit release/RyzenTempLimit
          Compress-Archive -Path release/RyzenTempLimit/* -DestinationPath release/RyzenTempLimit-win64.zip -Force

          ./scripts/build.ps1 -OneFile
          Copy-Item dist/RyzenTempLimit.exe release/RyzenTempLimit-onefile.exe -Force

          $hashes = @()
          foreach ($name in @('RyzenTempLimit-win64.zip', 'RyzenTempLimit-onefile.exe')) {
            $hash = (Get-FileHash (Join-Path release $name) -Algorithm SHA256).Hash.ToLower()
            $hashes += "$hash  $name"
          }
          $hashes | Set-Content -Encoding ascii release/sha256sums.txt

          Copy-Item LICENSE release/LICENSE -Force
          Copy-Item THIRD_PARTY_NOTICES.md release/THIRD_PARTY_NOTICES.md -Force
          Compress-Archive -Path licenses/* -DestinationPath release/licenses.zip -Force

      - name: Generate release notes
        shell: pwsh
        run: python scripts/release_notes.py "${{ github.ref_name }}" release/notes.md

      - name: Generate SBOM
        shell: pwsh
        run: |
          python -m pip install cyclonedx-bom
          python -m cyclonedx_py environment -o release/sbom.cdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/RyzenTempLimit-win64.zip
            release/RyzenTempLimit-onefile.exe

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            release/RyzenTempLimit-win64.zip `
            release/RyzenTempLimit-onefile.exe `
            release/sha256sums.txt `
            release/LICENSE `
            release/THIRD_PARTY_NOTICES.md `
            release/licenses.zip `
            release/sbom.cdx.json `
            --title "${{ github.ref_name }}" `
            --notes-file release/notes.md
